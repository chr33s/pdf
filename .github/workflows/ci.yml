name: CI

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: [v*]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: 'Select the package to publish'
        options: [common, codepoints, dfa, restructure, standard-fonts, unicode-trie, unicode-properties, upng, fontkit, pdf]
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          cache: "npm"
          node-version-file: "package.json"
      - run: npm ci --include=dev
      - run: npm run workspace build
      - run: npm run check
      - run: npm run workspace test
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: .
          include-hidden-files: true

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    needs: [build]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: actions/setup-node@v5
        with:
          cache: "npm"
          node-version-file: "package.json"
      - uses: actions/github-script@v7
        with:
          script: |
            const tag_name = context.ref;
            const name = tag_name.replace(/^refs\/tags\/v/, '');
            const version = name.split("/").at(-1);
            const prerelease = version.startsWith("0.") || version.includes("-");
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: latestRelease } = await github.rest.repos.getLatestRelease({
              owner,
              repo,
            });
            const latestReleaseTagName = latestRelease.tag_name;
            const latestReleaseVersion = latestReleaseTagName.split("/").at(-1);
            const body = `changes: [${latestReleaseVersion}...v${version}](https://github.com/${owner}/${repo}/compare/${latestReleaseVersion}...v${version})`;

            await github.rest.repos.createRelease({
              body,
              name,
              owner,
              prerelease,
              repo,
              tag_name,
            });

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        package: ${{ github.event_name == 'workflow_dispatch' && inputs.package != ''
          && fromJson(format('["{0}"]', inputs.package))
          || fromJson('["common","codepoints","dfa","restructure","standard-fonts","unicode-trie","unicode-properties","upng","fontkit","pdf"]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: actions/setup-node@v5
        with:
          cache: "npm"
          node-version-file: "package.json"
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --workspace packages/${{ matrix.package }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
